<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#153F38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ECM — Fiches pédagogiques</title>
<style>
  :root{--teal:#1F5C52;--teal-deep:#153F38;--gold:#C68A2E;--clay:#A6472B;--paper:#F3F0E6;--ink:#202A3C;--ink-soft:#5B6472;--line:#D8D2C2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Public Sans',Arial,sans-serif;background:var(--paper);color:var(--ink);}
  header{background:var(--teal-deep);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;}
  .hdr-row{display:flex;align-items:center;gap:10px;justify-content:space-between;}
  .hdr-left{display:flex;align-items:center;gap:8px;}
  .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0;flex-shrink:0;}
  header h1{font-size:17px;line-height:1.2;}
  header p{font-size:12px;opacity:.85;margin-top:2px;}
  .reglages-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;flex-shrink:0;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:400px;}
  .modal h2{font-size:16px;color:var(--teal-deep);margin-bottom:14px;}
  .modal label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .modal input{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;margin-bottom:12px;box-sizing:border-box;}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
  .btn-save{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;}
  .btn-close{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;}
  .container{max-width:720px;margin:0 auto;padding:14px;}
  .niveau-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .niveau-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);}
  .niveau-card .num{background:var(--teal);color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
  .niveau-card .info{flex:1;margin-left:14px;}
  .niveau-card .info h3{font-size:16px;}
  .niveau-card .info span{font-size:12px;color:var(--ink-soft);}
  .theme-group{margin-bottom:16px;}
  .theme-title{font-weight:700;color:var(--teal-deep);font-size:14px;border-bottom:2px solid var(--line);padding-bottom:4px;margin:16px 0 8px;}
  .lecon-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .lecon-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .lecon-card.integration{border-color:var(--clay);background:#FEF8F5;}
  .lecon-num{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;}
  .lecon-num.integration{color:var(--clay);}
  .lecon-titre{font-size:13.5px;margin-top:2px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .card h3{font-size:12px;font-weight:700;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .sp-box{background:var(--paper);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.6;}
  .no-content{color:var(--ink-soft);font-style:italic;font-size:13px;}
  .deroul-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .deroul-table th{background:var(--teal-deep);color:#fff;padding:6px 8px;text-align:left;font-size:11px;font-weight:600;}
  .deroul-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .deroul-table tr:nth-child(even) td{background:var(--paper);}
  .integration-banner{background:#FEF8F5;border:1px solid var(--clay);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--clay);}
  [contenteditable]:focus{outline:2px solid var(--gold);border-radius:4px;}
  [contenteditable]:hover{background:rgba(198,138,46,.05);}
  .fiche-img{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line);}
  .img-legende{font-size:11px;color:var(--ink-soft);font-style:italic;margin-top:4px;}
  #viewNiveaux,#viewNiveau,#viewFiche{display:none;}
  #viewNiveaux.active,#viewNiveau.active,#viewFiche.active{display:block;}
  .entete{width:100%;border-collapse:collapse;font-size:13px;}
  .entete td{padding:5px 8px;border:1px solid var(--line);vertical-align:top;}
  .entete td.k{font-weight:700;background:var(--paper);white-space:nowrap;width:1%;}
  .entete [contenteditable]{min-width:44px;display:inline-block;border-bottom:1px dotted var(--ink-soft);}
  .entete .nw{white-space:nowrap;margin-right:14px;}
  .info-list{font-size:13.5px;line-height:1.6;}
  .info-list div{margin-bottom:4px;}
  .info-list b{color:var(--teal-deep);}
  .te-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;white-space:normal;}
  .te-table th{background:var(--teal-deep);color:#fff;padding:5px 7px;text-align:left;font-size:12px;}
  .te-table td{padding:5px 7px;border:1px solid var(--line);vertical-align:top;}
  .modif{position:relative;}
  .modif::before{content:"modifié par vous";position:absolute;top:-17px;right:0;font-size:10px;color:var(--gold);font-style:italic;}
  .revert{background:none;border:none;color:var(--clay);font-size:11px;cursor:pointer;text-decoration:underline;padding:2px 0;margin-top:4px;}
  .alerte{background:#FFF7E6;border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5;}
  .alerte button{margin-top:6px;}
  .btn{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-light{background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .form-annexe{font-size:13.5px;}
  .form-annexe .champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin-bottom:12px;}
  .form-annexe .champ{border-bottom:1px dotted var(--ink-soft);padding-bottom:2px;}
  .form-annexe .listes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .form-annexe h4{font-size:13px;color:var(--teal-deep);margin-bottom:4px;}
  .form-annexe li{list-style:none;margin:3px 0;}
  .grille{width:100%;border-collapse:collapse;font-size:12.5px;}
  .grille th{background:var(--teal-deep);color:#fff;padding:5px 7px;text-align:left;}
  .grille td{padding:5px 7px;border:1px solid var(--line);vertical-align:top;}
  .grille td.pts{white-space:nowrap;text-align:center;font-weight:700;}
  .corrige summary{cursor:pointer;font-weight:700;color:var(--clay);font-size:13px;margin-top:10px;}
  @media print{ details.corrige{display:block;} details.corrige>summary{list-style:none;} }
  .table-wrap{overflow-x:auto;}
  @media (max-width:480px){
    .container{padding:10px;}
    .card{padding:12px 10px;}
    .entete td.k{white-space:normal;}
    .entete td,.te-table td,.te-table th{padding:4px 5px;}
    .te-table{font-size:12px;}
    .grille{font-size:11px;}
    .grille td,.grille th{padding:4px;hyphens:auto;-webkit-hyphens:auto;}
    .hdr-row>div{min-width:0;overflow-wrap:break-word;}
    .te-table td,.te-table th{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;}
  }
  @media print{
    @page{margin:12mm;}
    body{background:#fff;font-size:12px;}
    header,.no-print,.modal-overlay,.revert,.alerte{display:none!important;}
    .modif::before{display:none;}
    .container{max-width:none;padding:0;}
    .container>div:not(#viewFiche){display:none!important;}
    #viewFiche{display:block!important;}
    .card{break-inside:auto;border:1px solid #bbb;border-radius:4px;padding:8px 10px;margin-bottom:8px;}
    .deroul-table tr,.te-table tr,.grille tr{break-inside:avoid;}
    .table-wrap{overflow:visible;}
    th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    [contenteditable]:hover{background:none;}
  }
</style>
</head>
<body>
<header>
  <div id="hdrNiveaux" class="hdr-row">
    <div class="hdr-left"><div><h1>📘 ECM — Collège</h1><p>Éducation Civique et Morale — 4 niveaux · <span id="versionApp"></span></p></div></div>
    <button class="reglages-btn" onclick="openReglages()">⚙ Réglages</button>
  </div>
  <div id="hdrNiveau" class="hdr-row" style="display:none">
    <button class="back-btn" onclick="goNiveaux()">←</button>
    <div><h1 id="hdrNiveauTitre"></h1><p id="hdrNiveauMeta"></p></div>
  </div>
  <div id="hdrFiche" class="hdr-row" style="display:none">
    <button class="back-btn" onclick="goNiveau()">←</button>
    <div><h1 id="hdrFicheTitre" style="font-size:15px;"></h1><p id="hdrFicheMeta"></p></div>
  </div>
</header>
<div class="container">
  <div id="viewNiveaux" class="active"></div>
  <div id="viewNiveau"></div>
  <div id="viewFiche"></div>
</div>

<div class="modal-overlay" id="modalReglages">
  <div class="modal">
    <h2>⚙ Réglages</h2>
    <label>Nom du professeur</label>
    <input id="r-prof" type="text" placeholder="Ex : M. Kodjo">
    <label>Établissement</label>
    <input id="r-etab" type="text" placeholder="Ex : IESG-Kpalimé">
    <label>Année scolaire</label>
    <input id="r-annee" type="text" placeholder="Ex : 2025-2026">
    <div class="modal-btns">
      <button class="btn-close" onclick="closeReglages()">Annuler</button>
      <button class="btn-save" onclick="saveReglages()">Enregistrer</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const NIVEAU_LABELS = {'6e':'6ème','5e':'5ème','4e':'4ème','3e':'3ème'};
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Texte -> HTML : les blocs de lignes commençant par "|" deviennent un tableau
// (1re ligne = en-têtes). Les tableaux sont écrits sans saut de ligne pour ne pas
// créer de lignes vides dans les zones en white-space:pre-line.
function fmt(s){
  const out=[]; let rows=[];
  const flush=()=>{
    if(!rows.length) return;
    const cells=r=>r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
    let t='<table class="te-table"><thead><tr>'+cells(rows[0]).map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
    rows.slice(1).forEach(r=>{t+='<tr>'+cells(r).map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';});
    out.push(t+'</tbody></table>'); rows=[];
  };
  String(s||'').split('\n').forEach(line=>{
    if(line.trim().startsWith('|')) rows.push(line.trim());
    else if(/^(INTRODUCTION|DÉVELOPPEMENT|CONCLUSION)$/.test(line.trim())){ flush(); out.push('<b style="color:var(--teal-deep)">'+esc(line.trim())+'</b>'); }
    else { flush(); out.push(esc(line)); }
  });
  flush();
  return out.join('\n').replace(/\n(<table)/g,'$1').replace(/(<\/table>)\n/g,'$1');
}

// Zones modifiables. Une modification n'est enregistrée que si le texte diffère
// de l'original ; sinon la clé est supprimée (les corrections futures de data.js
// restent donc visibles tant que la section n'a pas été réellement modifiée).
const PREFIX='ecm_';
function ed(key, html, style){
  return `<div contenteditable="true" data-key="${key}" style="${style||''}">${html}</div>`;
}
function bindEditables(root){
  let modifs=0;
  root.querySelectorAll('[contenteditable][data-key]').forEach(box=>{
    const key=PREFIX+box.dataset.key;
    const orig=box.innerHTML;
    let saved=null;
    try{ saved=localStorage.getItem(key); }catch(e){}
    if(saved!==null){
      if(saved===orig){ try{localStorage.removeItem(key);}catch(e){} }
      else { box.innerHTML=saved; markModif(box,orig,key); if(!SAISIE.test(box.dataset.key)) modifs++; }
    }
    box.addEventListener('blur',()=>{
      try{
        if(box.innerHTML===orig){ localStorage.removeItem(key); unmark(box); }
        else { localStorage.setItem(key,box.innerHTML); markModif(box,orig,key); }
      }catch(e){}
    });
  });
  return modifs;
}
// Champs à remplir (n° de fiche, séance, effectif, date) : simple saisie, pas de marque « modifié »
const SAISIE=/^(fn_|seance_|eff_|date_)/;
function markModif(box,orig,key){
  if(SAISIE.test(box.dataset.key)) return;
  box.classList.add('modif');
  if(box.nextElementSibling && box.nextElementSibling.classList.contains('revert')) return;
  const b=document.createElement('button');
  b.className='revert no-print'; b.textContent='↺ Revenir au texte d\'origine';
  b.onclick=()=>{ box.innerHTML=orig; try{localStorage.removeItem(key);}catch(e){} unmark(box); };
  box.after(b);
}
function unmark(box){
  box.classList.remove('modif');
  const n=box.nextElementSibling;
  if(n && n.classList.contains('revert')) n.remove();
}
function reinitFiche(prefixes, rerender){
  if(!confirm('Effacer toutes vos modifications de cette fiche et revenir au texte d\'origine ?')) return;
  try{
    Object.keys(localStorage).filter(k=>prefixes.some(p=>k===PREFIX+p || (p.endsWith('_') && k.startsWith(PREFIX+p)))).forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  rerender();
}
function reglage(k){ try{ return localStorage.getItem('ecm_'+k)||''; }catch(e){ return ''; } }
function alerteModifs(n){
  if(!n) return '';
  return `<div class="alerte no-print">✎ ${n} section(s) de cette fiche affichent <b>vos modifications</b> enregistrées sur cet appareil, et non le texte d'origine (qui a pu être corrigé depuis).<br>
    <button class="btn btn-light" id="btnToutOrig">↺ Tout remettre au texte d'origine</button></div>`;
}

let currentNiveau = null;

function renderNiveaux(){
  let h='';
  Object.keys(NIVEAUX).forEach(niv=>{
    const d = NIVEAUX[niv];
    h+=`<div class="niveau-card" onclick="openNiveau('${niv}')">
      <div class="num">${niv}</div>
      <div class="info"><h3>Classe de ${NIVEAU_LABELS[niv]}</h3><span>${d.lecons.length} leçons · ${d.integrations.length} intégrations</span></div>
      <div>›</div></div>`;
  });
  document.getElementById('viewNiveaux').innerHTML = h;
}

function openNiveau(niv){
  currentNiveau = niv;
  const d = NIVEAUX[niv];
  document.getElementById('hdrNiveauTitre').textContent = 'Classe de ' + NIVEAU_LABELS[niv];
  document.getElementById('hdrNiveauMeta').textContent = d.lecons.length+' leçons · '+d.integrations.length+' intégrations';
  document.getElementById('hdrNiveaux').style.display='none';
  document.getElementById('hdrNiveau').style.display='flex';
  document.getElementById('viewNiveaux').classList.remove('active');
  document.getElementById('viewNiveau').classList.add('active');

  const byTheme = {};
  d.lecons.forEach(l=>{ if(!byTheme[l.theme]) byTheme[l.theme]=[]; byTheme[l.theme].push(l); });

  let h='';
  Object.keys(byTheme).forEach(theme=>{
    h+=`<div class="theme-group"><div class="theme-title">${esc(theme)}</div>`;
    byTheme[theme].forEach(l=>{
      h+=`<div class="lecon-card" onclick="openFiche('${niv}',${l.numero})">
        <div><div class="lecon-num">Leçon ${l.numero} · ${l.seances||2} séances</div><div class="lecon-titre">${esc(l.titre)}</div></div>
        <div>›</div></div>`;
    });
    // Intégration après ce thème si elle existe
    const themeNum = Object.keys(byTheme).indexOf(theme)+1;
    h+='</div>';
  });

  h+=`<div class="theme-group"><div class="theme-title" style="color:var(--clay)">🧩 Intégrations</div>`;
  d.integrations.forEach(i=>{
    h+=`<div class="lecon-card integration" onclick="openIntegration('${niv}',${i.numero})">
      <div><div class="lecon-num integration">Intégration ${i.numero}</div><div class="lecon-titre">${esc(i.theme)}</div></div>
      <div>›</div></div>`;
  });
  h+='</div>';

  document.getElementById('viewNiveau').innerHTML = h;
}

function goNiveaux(){
  document.getElementById('hdrNiveau').style.display='none';
  document.getElementById('hdrNiveaux').style.display='flex';
  document.getElementById('viewNiveau').classList.remove('active');
  document.getElementById('viewNiveaux').classList.add('active');
}

function showFicheView(titre, meta){
  document.getElementById('hdrFicheTitre').textContent = titre;
  document.getElementById('hdrFicheMeta').textContent = meta;
  document.getElementById('hdrNiveau').style.display='none';
  document.getElementById('hdrFiche').style.display='flex';
  document.getElementById('viewNiveau').classList.remove('active');
  document.getElementById('viewFiche').classList.add('active');
  window.scrollTo(0,0);
}

function openFiche(niv, numero){
  const l = NIVEAUX[niv].lecons.find(x=>x.numero===numero);
  const seances = l.seances||2;
  const k = `${niv}_${numero}`;
  showFicheView(l.titre, 'Leçon '+l.numero+' · '+NIVEAU_LABELS[niv]+' · '+seances+' séances × 55 min');

  let h=`<div class="no-print" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="btn btn-teal" onclick="window.print()">🖨 Imprimer / PDF</button>
    <button class="btn btn-light" id="btnReinit">↺ Réinitialiser la fiche</button>
  </div><div id="zoneAlerte"></div>`;

  // En-tête officiel d'une fiche pédagogique (format FLOOOO / IESG-Kpalimé)
  h+=`<div class="card"><table class="entete">
    <tr><td class="k">Fiche N°</td><td>${ed('fn_'+k, String(l.numero))}</td>
        <td class="k">AN/SC</td><td>${esc(reglage('annee'))}</td></tr>
    <tr><td class="k">Discipline</td><td>ECM</td>
        <td class="k">Classe</td><td>${NIVEAU_LABELS[niv]}</td></tr>
    <tr><td class="k">Établissement</td><td colspan="3">${esc(reglage('etab'))}</td></tr>
    <tr><td class="k">Nom du professeur</td><td colspan="3">${esc(reglage('prof'))}</td></tr>
    <tr><td class="k">Effectif</td><td colspan="3"><span class="nw">F = ${ed('eff_f_'+k,'')}</span> <span class="nw">G = ${ed('eff_g_'+k,'')}</span></td></tr>
    <tr><td class="k">Thème</td><td colspan="3">${esc(l.theme)}</td></tr>
    <tr><td class="k">Leçon ${l.numero}</td><td colspan="3"><b>${esc(l.titre)}</b></td></tr>
    <tr><td class="k">Nombre de séances</td><td>${seances}</td><td class="k">Durée d'une séance</td><td>55 min</td></tr>
  </table></div>`;

  if(l.documentation && l.documentation.length){
    h+=`<div class="card"><h3>Documentation</h3><ul style="font-size:12.5px;line-height:1.7;padding-left:18px;color:var(--ink-soft);">`;
    l.documentation.forEach(ref=>{ h+=`<li>${esc(ref)}</li>`; });
    h+=`</ul></div>`;
  }

  h+=`<div class="card info-list">
    <div><b>Supports didactiques :</b> ${ed('sup_'+k, esc(l.supports||''), 'display:inline')}</div>
    <div><b>Prérequis :</b> ${ed('pre_'+k, esc(l.prerequis||''), 'display:inline')}</div>
    <div><b>Méthode :</b> ${ed('met_'+k, esc(l.methodes||''), 'display:inline')}</div>
    <div><b>Techniques :</b> ${ed('tec_'+k, esc(l.techniques||''), 'display:inline')}</div>
    <div><b>Compétence visée :</b> ${ed('comp_'+k, esc(l.competence||''), 'display:inline')}</div>
  </div>`;

  if(l.capacitesContenus && l.capacitesContenus.length){
    h+=`<div class="card"><h3>Capacités et contenus</h3><div class="table-wrap">
      <table class="deroul-table"><thead><tr><th style="width:45%">Capacités</th><th>Contenus</th></tr></thead><tbody>`;
    l.capacitesContenus.forEach(c=>{
      h+=`<tr><td>${esc(c[0])}</td><td>${esc(c[1]).replace(/\n/g,'<br>')}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
    if(l.nb) h+=`<p style="font-size:13px;margin-top:8px"><b>NB (programme) :</b> ${esc(l.nb)}</p>`;
    h+=`</div>`;
  }

  h+=`<div class="card"><h3>Situation d'apprentissage</h3>
    <div class="sp-box">${ed('sa_'+k, esc(l.situationApprentissage))}</div></div>`;

  if(l.images && l.images.length){
    h+=`<div class="card"><h3>Documents</h3>`;
    l.images.forEach(img=>{
      h+=`<img class="fiche-img" src="${esc(img.fichier)}" alt="${esc(img.legende)}">
        <div class="img-legende">${esc(img.legende)}</div>`;
    });
    h+='</div>';
  }

  if(l.formulaire){
    const f=l.formulaire;
    h+=`<div class="card form-annexe"><h3>${esc(f.titre)}</h3>
      <div class="champs">${f.champs.map(c=>`<div class="champ">${esc(c)} : </div>`).join('')}</div>
      <div class="listes">${f.listes.map(li=>`<div><h4>${esc(li.titre)}</h4><ul>
        ${li.items.map(it=>`<li>☐ ${esc(it)}</li>`).join('')}
        <li>☐ Autre : ……………………………</li></ul></div>`).join('')}</div>
      <p class="img-legende" style="margin-top:8px">Cocher les cases qui te correspondent.</p></div>`;
  }

  if(l.deroulement.length){
    const tot=l.deroulement.reduce((s,p)=>s+(parseInt(p.duree)||0),0);
    h+=`<div class="card"><h3>Déroulement d'une séance — ${tot} min</h3>
      ${seances>2?`<p class="img-legende no-print" style="margin-bottom:6px">Cette leçon compte ${seances} séances : adaptez les activités et les capacités visées à la séance du jour.</p>`:''}
      <div class="table-wrap">
      <table class="deroul-table"><thead><tr><th>Moments didactiques</th><th>Durée</th><th>Activités du professeur</th><th>Activités des élèves</th><th>Matériels didactiques</th></tr></thead><tbody>`;
    l.deroulement.forEach((p,pi)=>{
      h+=`<tr>
        <td style="font-weight:700;color:var(--teal-deep)">${esc(p.phase)}</td>
        <td style="color:var(--gold);font-weight:700;white-space:nowrap">${esc(p.duree)}${p.duree?" min":''}</td>
        <td>${ed(`d_${k}_${pi}_p`, esc(p.activiteProf)||'—', 'white-space:pre-line')}</td>
        <td>${ed(`d_${k}_${pi}_e`, esc(p.activiteEleve)||'—', 'white-space:pre-line')}</td>
        <td>${ed(`d_${k}_${pi}_s`, esc(p.support)||'', 'white-space:pre-line;color:var(--ink-soft);font-style:italic')}</td>
      </tr>`;
    });
    h+='</tbody></table></div></div>';
  }

  h+=`<div class="card"><h3>Trace écrite</h3>
    ${ed('te_'+k, fmt(l.traceEcrite), 'font-size:14px;line-height:1.7;white-space:pre-line;')}</div>`;

  h+=`<div class="card"><h3>Évaluation</h3>
    ${ed('ev_'+k, fmt(l.evaluation), 'font-size:14px;line-height:1.6;white-space:pre-line;')}</div>`;

  if(l.devoirMaison){
    h+=`<div class="card"><h3>Exercice de maison</h3>
      ${ed('dm_'+k, fmt(l.devoirMaison), 'font-size:14px;line-height:1.6;white-space:pre-line;')}</div>`;
  }

  const el = document.getElementById('viewFiche');
  el.innerHTML = h;
  const prefixes=['fn_','eff_f_','eff_g_','sup_','pre_','met_','tec_','comp_','sa_','te_','ev_','dm_'].map(p=>p+k).concat(['d_'+k+'_']);
  // Effectif, date et n° de fiche sont des saisies normales : pas d'alerte pour eux
  const n = bindEditables(el);
  const rerender=()=>openFiche(niv, numero);
  document.getElementById('zoneAlerte').innerHTML = alerteModifs(n);
  const bt=document.getElementById('btnToutOrig');
  if(bt) bt.onclick=()=>reinitFiche(prefixes.filter(p=>!SAISIE.test(p)), rerender);
  document.getElementById('btnReinit').onclick=()=>reinitFiche(prefixes, rerender);
}

// Grille de notation au format FLOOOO : une ligne par consigne (ou par situation quand il y en a
// plusieurs), 4 critères à points égaux → critères minimaux = 3/4 de la note, perfectionnement = 1/4.
function grilleMatriceHTML(k, i){
  // La situation de remédiation n'est pas notée
  const sits=i.situations.filter(s=>!/remédiation/i.test(s.titre));
  const rows = sits.length>1
    ? sits.map((s,n)=>'Situation '+(n+1))
    : sits[0].consignes.map((c,n)=>'Consigne '+(n+1));
  const pt = rows.length===1 ? 2 : 1;
  const total = rows.length*pt*4;
  let h=`<div class="table-wrap"><table class="grille"><thead><tr><th></th><th>Pertinence</th><th>Correction</th><th>Cohérence</th><th>Perfectionnement</th><th>Total</th></tr></thead><tbody>`;
  rows.forEach(r=>{ h+=`<tr><td><b>${r}</b></td>${[1,2,3,4].map(()=>`<td class="pts">${pt} pt${pt>1?'s':''}</td>`).join('')}<td class="pts">${pt*4} pts</td></tr>`; });
  h+=`<tr><td colspan="5" style="text-align:right;font-weight:700">Total</td><td class="pts">${total} pts</td></tr></tbody></table></div>`;
  if(total!==20) h+=`<p class="img-legende" style="margin-top:4px">Note sur ${total} : pour l'avoir sur 20, multiplier par 20 puis diviser par ${total}.</p>`;
  h+=`<p style="font-size:12.5px;margin-top:6px">Critères minimaux (Pertinence, Correction, Cohérence) = 3/4 des points ; critère de perfectionnement = 1/4.</p>`;
  return h;
}

// Indicateurs pour guider la correction (sans barème : le barème est dans la grille ci-dessus)
function indicateursHTML(k, i){
  const row=(crit, ind, indices, key)=>`<tr><td><b>${crit}</b></td><td>${ind}</td><td>${ed(key, indices)}</td></tr>`;
  return `<div class="table-wrap"><table class="grille"><thead><tr><th>Critères</th><th>Indicateurs</th><th>Indices</th></tr></thead><tbody>
    ${row('Pertinence','Production conforme au support et à la consigne','Personnages, contexte et problème de la situation repris ; toutes les tâches traitées ; réponses justes (voir corrigé)','g1_'+k)}
    ${row('Correction','Utilisation adéquate des concepts et outils de la discipline','Notions du thème : '+esc(i.lecons),'g4_'+k)}
    ${row('Cohérence','Enchaînement logique des idées','Introduction, développement, conclusion ; connecteurs logiques','g5_'+k)}
    ${row('Perfectionnement','Langue et présentation ; complétude','Phrases correctes, grammaire et ponctuation, bonne présentation, lisibilité, pas de ratures, paragraphes délimités, originalité ; devoir achevé','g6_'+k)}
  </tbody></table></div>`;
}

// Déroulement type d'une séance d'intégration (format des fiches d'intégration FLOOOO), 55 min
const DEROUL_INT=[
  ['Remobilisation des prérequis','3','Prise de contact, contrôle de présence ; pose rapidement une ou deux questions sur les leçons du thème','Répondent à l\'appel et aux questions','Cahiers de présence et de textes, tableau'],
  ['Présentation de la situation d\'intégration','2','Lit posément la situation d\'intégration','Suivent attentivement','Situation d\'intégration au tableau'],
  ['Appropriation de la situation','5','Relit la situation ; fait relever le problème posé (Quel est le problème ? Que vous demande-t-on ?) ; s\'assure que la tâche est comprise ; organise les groupes','Un élève lit, les autres suivent ; relèvent le problème et les consignes','Situation d\'intégration + support'],
  ['Résolution','10','Demande à chacun de traiter seul puis en groupe ; passe de groupe en groupe et réoriente si besoin','Travaillent seuls puis en groupe ; préparent une production','Situation d\'intégration + support'],
  ['Mise en commun','10','Désigne un groupe pour présenter sa production et fait réagir la classe ; valide et améliore les propositions','Le groupe présente ; les autres réagissent et participent au débat','Productions des groupes'],
  ['Institutionnalisation','15','Construit avec les élèves la production modèle (voir corrigé type) ; rappelle la démarche de traitement d\'une situation','Participent et notent la production dans leur cahier','Tableau, cahier'],
  ['Réinvestissement','10','Récapitule la démarche ; évaluation : une ou deux questions sur les consignes ; exercice de maison : traiter la situation 2','Répondent ; notent l\'exercice de maison','Tableau, cahier d\'exercices'],
];

function openIntegration(niv, numero){
  const i = NIVEAUX[niv].integrations.find(x=>x.numero===numero);
  const k = `${niv}_${numero}`;
  showFicheView('Intégration '+i.numero, NIVEAU_LABELS[niv]+' · '+i.theme);

  let h=`<div class="no-print" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="btn btn-teal" onclick="window.print()">🖨 Imprimer / PDF</button>
    <button class="btn btn-light" id="btnReinit">↺ Réinitialiser la fiche</button>
  </div><div id="zoneAlerte"></div>`;

  h+=`<div class="card"><table class="entete">
    <tr><td class="k">Fiche</td><td>Intégration ${i.numero}</td><td class="k">AN/SC</td><td>${esc(reglage('annee'))}</td></tr>
    <tr><td class="k">Discipline</td><td>ECM</td><td class="k">Classe</td><td>${NIVEAU_LABELS[niv]}</td></tr>
    <tr><td class="k">Établissement</td><td colspan="3">${esc(reglage('etab'))}</td></tr>
    <tr><td class="k">Nom du professeur</td><td colspan="3">${esc(reglage('prof'))}</td></tr>
    <tr><td class="k">Effectif</td><td colspan="3"><span class="nw">F = ${ed('eff_f_i'+k,'')}</span> <span class="nw">G = ${ed('eff_g_i'+k,'')}</span></td></tr>
    <tr><td class="k">Thème</td><td colspan="3">${esc(i.theme)}</td></tr>
    <tr><td class="k">Leçons</td><td colspan="3">${esc(i.lecons)}</td></tr>
    <tr><td class="k">Nombre de séances</td><td>3</td><td class="k">Durée d'une séance</td><td>55 min</td></tr>
  </table>
  <p class="img-legende" style="margin-top:6px">3 séances : situation traitée avec les élèves · situation traitée individuellement · correction et remédiation.</p></div>`;

  // Capacités évaluées : celles des leçons du thème
  const caps=[];
  (i.leconsNums||[]).forEach(n=>{
    const l=NIVEAUX[niv].lecons.find(x=>x.numero===n);
    if(l) l.capacitesContenus.forEach(c=>caps.push(c));
  });
  if(caps.length){
    h+=`<div class="card"><h3>Capacités évaluées</h3><div class="table-wrap"><table class="deroul-table"><thead><tr><th style="width:45%">Capacités</th><th>Contenus</th></tr></thead><tbody>`;
    caps.forEach(c=>{ h+=`<tr><td>${esc(c[0])}</td><td>${esc(c[1]).replace(/\n/g,'<br>')}</td></tr>`; });
    h+=`</tbody></table></div></div>`;
  }

  // Première intégration de 6e : apprentissage de la démarche de traitement d'une situation d'évaluation
  if(i.methode){
    h+=`<div class="card" style="border:2px solid var(--gold)"><h3>📝 Méthode : traiter une situation d'évaluation</h3>
      <p class="img-legende no-print" style="margin-bottom:6px">À enseigner lors de cette première intégration ; les élèves la recopient dans leur cahier et l'appliquent ensuite à chaque situation.</p>
      ${ed('imeth_'+k, fmt(i.methode), 'font-size:14px;line-height:1.7;white-space:pre-line;')}</div>`;
  }
  // Première intégration de 5e, 4e, 3e : rappel de la démarche
  if(i.rappel){
    h+=`<div class="card" style="border:2px solid var(--gold)"><h3>🔁 Rappel : traiter une situation d'évaluation</h3>
      <p class="img-legende no-print" style="margin-bottom:6px">À rappeler en début de séance (remobilisation) ; les élèves la relisent dans leur cahier.</p>
      ${ed('irap_'+k, fmt(i.rappel), 'font-size:14px;line-height:1.7;white-space:pre-line;')}</div>`;
  }

  i.situations.forEach((s,n)=>{
    h+=`<div class="card"><h3>${esc(s.titre)}</h3>
      <div class="sp-box">${ed(`isit_${k}_${n}`, esc(s.texte))}</div>
      <div style="margin-top:10px;font-size:14px;line-height:1.6"><b>Consigne${s.consignes.length>1?'s':''} :</b>
        ${ed(`icons_${k}_${n}`, s.consignes.map((c,j)=>(s.consignes.length>1?(j+1)+'. ':'')+esc(c)).join('\n'), 'white-space:pre-line')}</div>
      ${n===0 && i.analyse ? `<div style="margin-top:10px">${ed('iana_'+k, fmt(i.analyse), 'font-size:13.5px;line-height:1.6;white-space:pre-line;font-weight:normal')}</div>` : ''}
      <details class="corrige" ${n===0?'open':''}><summary>Corrigé type</summary>
        ${ed(`icor_${k}_${n}`, fmt(s.corrige), 'font-size:14px;line-height:1.7;white-space:pre-line;margin-top:6px')}</details>
    </div>`;
  });

  h+=`<div class="card"><h3>Grille de notation</h3>${grilleMatriceHTML(k,i)}
    <h3 style="margin-top:12px">Indicateurs de correction</h3>${indicateursHTML(k,i)}</div>`;

  h+=`<div class="card"><h3>Déroulement de la séance d'intégration — 55 min</h3><div class="table-wrap">
    <table class="deroul-table"><thead><tr><th>Moments didactiques</th><th>Durée</th><th>Activités du professeur</th><th>Activités des élèves</th><th>Matériels didactiques</th></tr></thead><tbody>`;
  let deroul = i.deroulement || DEROUL_INT;
  if(i.rappel){
    // Remobilisation allongée pour rappeler la démarche (5 min), institutionnalisation raccourcie (13 min) : total 55 min
    deroul = deroul.map(p=>p.slice());
    deroul[0][1]='5'; deroul[0][2]+=' ; fait rappeler les 6 étapes de traitement d\'une situation d\'évaluation (encadré « Rappel »)'; deroul[0][3]+=' ; récitent les étapes de la démarche';
    deroul[5][1]='13';
  }
  deroul.forEach((p,pi)=>{
    h+=`<tr><td style="font-weight:700;color:var(--teal-deep)">${esc(p[0])}</td>
      <td style="color:var(--gold);font-weight:700;white-space:nowrap">${p[1]} min</td>
      <td>${ed(`idr_${k}_${pi}_p`, esc(p[2]), 'white-space:pre-line')}</td>
      <td>${ed(`idr_${k}_${pi}_e`, esc(p[3]), 'white-space:pre-line')}</td>
      <td>${ed(`idr_${k}_${pi}_s`, esc(p[4]), 'white-space:pre-line;color:var(--ink-soft);font-style:italic')}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  const el = document.getElementById('viewFiche');
  el.innerHTML = h;
  const prefixes=['eff_f_i'+k,'eff_g_i'+k,'g1_'+k,'g4_'+k,'g5_'+k,'g6_'+k,
    'isit_'+k+'_','icons_'+k+'_','icor_'+k+'_','idr_'+k+'_','imeth_'+k,'iana_'+k,'irap_'+k];
  const rerender=()=>openIntegration(niv, numero);
  document.getElementById('zoneAlerte').innerHTML = alerteModifs(bindEditables(el));
  const bt=document.getElementById('btnToutOrig');
  if(bt) bt.onclick=()=>reinitFiche(prefixes.filter(p=>!SAISIE.test(p)), rerender);
  document.getElementById('btnReinit').onclick=()=>reinitFiche(prefixes, rerender);
}

function goNiveau(){
  document.getElementById('hdrFiche').style.display='none';
  document.getElementById('hdrNiveau').style.display='flex';
  document.getElementById('viewFiche').classList.remove('active');
  document.getElementById('viewNiveau').classList.add('active');
}

function openReglages(){
  document.getElementById('r-prof').value=localStorage.getItem('ecm_prof')||'';
  document.getElementById('r-etab').value=localStorage.getItem('ecm_etab')||'';
  document.getElementById('r-annee').value=localStorage.getItem('ecm_annee')||'';
  document.getElementById('modalReglages').classList.add('active');
}
function closeReglages(){ document.getElementById('modalReglages').classList.remove('active'); }
function saveReglages(){
  localStorage.setItem('ecm_prof',document.getElementById('r-prof').value);
  localStorage.setItem('ecm_etab',document.getElementById('r-etab').value);
  localStorage.setItem('ecm_annee',document.getElementById('r-annee').value);
  closeReglages();
}

// Numéro de version affiché en haut de l'accueil (le changer à chaque publication, comme CACHE_NAME dans sw.js)
const APP_VERSION = 'version 16 du 27/09/2026';
document.getElementById('versionApp').textContent = APP_VERSION;

renderNiveaux();
// À l'impression, déplier tous les corrigés
window.addEventListener('beforeprint', ()=>document.querySelectorAll('details').forEach(d=>d.open=true));

if ('serviceWorker' in navigator) {
  // Quand une nouvelle version prend la main, on recharge une fois pour l'afficher tout de suite
  const avaitUnControleur = !!navigator.serviceWorker.controller;
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (avaitUnControleur && !recharge) { recharge = true; location.reload(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      // Vérifier aussi les mises à jour quand on revient sur l'application
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
    }).catch(err => console.log('SW registration failed:', err));
  });
}
</script>
